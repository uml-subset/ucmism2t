# execution binary
launcher            = ${ucmism2t_dir}/releng/ucmism2t.product/target/products/ucmism2t.product/linux/gtk/x86_64/ucmism2t

# model folder
model_folder        = /media/wackerow/Shared/CDIF/Documentation/Technical/Work/markdown2uml/claude_xmi_40_newStructure
# model_folder        = /media/wackerow/Shared/CDIF/Documentation/Technical/Work/markdown2uml/claude_xmi_39_after_reports
