# folder with generated artefacts
generated_folder    = ${model_folder}/generated

# folder for sphinx logs
log_folder          = ${model_folder}/log

# Software
software_home       = /home/wackerow/software

# Saxon jar. used by XSLT
saxon_jar           = ${software_home}/saxon/SaxonHE12-9J/saxon-he-12.9.jar

# Plantuml jar, used by Sphinx
plantuml_jar        = ${software_home}/plantuml/plantuml-1.2025.2.jar

# model xmi file
# used for xmi fragment extraction
model_file          = ${model_folder}/cdif-universe.xmi

# model xmi file eclipse variant. the name must have the same name as the model_file plus the postfix '_eclipse'.
# used for acceleo processing
model_file_eclipse  = ${model_folder}/cdif-universe_eclipse.xmi

# file with model-specific properties
model_properties    = /media/wackerow/Shared/CDIF/Documentation/Technical/Work/markdown2uml/for_ucmism2t/cdif-model.properties

# logo file for the model
logo_file           = /media/wackerow/Shared/CDIF/Documentation/Technical/Work/markdown2uml/for_ucmism2t/cdif640-transparent.png
