# Example Configuration File for ucmism2t
#
# This file demonstrates available configuration properties
# that can be accessed from Acceleo templates using:
#   [model.getProperty('key.name')/]

# Project Metadata
project.name=ExampleProject
project.version=1.0.0
project.author=John Doe
project.company=Example Corporation
project.description=Example UML model transformation

# Output Settings
output.encoding=UTF-8
output.line.separator=\n
output.file.prefix=
output.file.suffix=.txt

# Generation Control
max.depth=10
include.documentation=true
include.stereotypes=true
include.tagged.values=true

# Java Code Generation
java.package.prefix=com.example
java.indent.size=4
java.indent.char=space
java.use.tabs=false
generate.getters=true
generate.setters=true
generate.constructors=true
generate.toString=true
generate.equals=true
generate.hashCode=true

# Database Settings
database.table.prefix=
database.column.naming=snake_case
database.use.timestamps=true
database.cascade.delete=false

# Documentation
doc.include.diagrams=true
doc.include.examples=true
doc.format=markdown
doc.template=standard

# Debug and Logging
debug.enabled=false
log.level=INFO
verbose.output=false
